<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Psychology — Colin Merrill</title>
<meta name="description" content="A wound and false belief generator for fiction writers — Colin Merrill.">
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fff;
    --accent: #8b3a1a;
    --faint: #d8d0bc;
    --gold: #b8922a;
    --muted: #6b5e4a;
    --card-bg: #faf8f4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  .tool-wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 24px 0;
  }

  .tool-header {
    text-align: center;
    margin-bottom: 52px;
  }

  .tool-header h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 2.2rem;
    font-weight: 300;
    letter-spacing: 0.06em;
  }

  .tool-header h1 em { font-style: italic; color: var(--accent); }

  .tool-header::after {
    content: '';
    display: block;
    width: 100px;
    height: 1px;
    background: var(--gold);
    margin: 14px auto 0;
  }

  .tool-header p {
    font-size: 0.88rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 14px;
  }

  /* CARDS */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--faint);
    padding: 20px 22px 18px;
    margin-bottom: 2px;
    transition: box-shadow 0.2s;
  }

  .card:hover { box-shadow: 0 2px 12px rgba(26,18,8,0.05); }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
  }

  .card-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 7px;
    padding-top: 1px;
  }

  .card-body {
    font-family: 'Crimson Pro', serif;
    font-size: 1.08rem;
    font-weight: 300;
    line-height: 1.65;
    color: var(--ink);
    min-height: 3.5rem;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .card-body.fading {
    opacity: 0;
    transform: translateY(4px);
  }

  .card-note {
    font-style: italic;
    font-size: 0.88rem;
    color: var(--muted);
    margin-top: 12px;
    line-height: 1.55;
    border-top: 1px solid var(--faint);
    padding-top: 12px;
    min-height: 2.5rem;
    transition: opacity 0.18s ease;
  }

  .card-note.fading { opacity: 0; }

  /* LOCK BUTTON */
  .lock-btn {
    font-family: 'Crimson Pro', serif;
    font-size: 0.76rem;
    letter-spacing: 0.07em;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--faint);
    border-radius: 2px;
    padding: 3px 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .lock-btn:hover { border-color: var(--accent); color: var(--accent); }
  .lock-btn.locked { border-color: var(--accent); color: var(--accent); background: rgba(139,58,26,0.04); }

  /* CONNECTOR */
  .connector {
    display: flex;
    justify-content: center;
    height: 26px;
    font-size: 1.1rem;
    color: var(--gold);
    opacity: 0.45;
    align-items: center;
  }

  /* ACTIONS */
  .actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 40px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    letter-spacing: 0.1em;
    padding: 9px 26px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.18s;
    border-radius: 2px;
  }

  .btn:hover { background: var(--ink); color: #fff; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: #6d2c13; }
</style>
</head>
<body>

<header class="site-header">
  <a href="/" class="site-title">
    Colin Merrill
    <svg width="20" height="18" viewBox="0 0 40 36" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="13" y="2" width="14" height="8" rx="1"/>
      <line x1="16" y1="5" x2="24" y2="5" stroke-width="0.8"/>
      <line x1="16" y1="7" x2="22" y2="7" stroke-width="0.8"/>
      <rect x="4" y="10" width="32" height="16" rx="2"/>
      <rect x="8" y="14" width="4" height="3" rx="0.5"/>
      <rect x="14" y="14" width="4" height="3" rx="0.5"/>
      <rect x="20" y="14" width="4" height="3" rx="0.5"/>
      <rect x="26" y="14" width="4" height="3" rx="0.5"/>
      <rect x="10" y="19" width="4" height="3" rx="0.5"/>
      <rect x="16" y="19" width="4" height="3" rx="0.5"/>
      <rect x="22" y="19" width="4" height="3" rx="0.5"/>
      <path d="M4 26 L2 32 L38 32 L36 26"/>
      <circle cx="6" cy="12" r="1.5"/>
      <circle cx="34" cy="12" r="1.5"/>
    </svg>
  </a>
</header>

<div class="tool-wrap">

  <div class="tool-header">
    <h1><em>Character</em> Psychology</h1>
    <p>Wound &amp; False Belief Generator</p>
  </div>

  <div class="card" id="wound-card">
    <div class="card-top">
      <div class="card-label">The Wound</div>
      <button class="lock-btn" id="lock-wound" onclick="toggleLock('wound')">Lock</button>
    </div>
    <div class="card-body" id="wound-text"></div>
    <div class="card-note" id="wound-note"></div>
  </div>

  <div class="connector">↓</div>

  <div class="card" id="belief-card">
    <div class="card-top">
      <div class="card-label">The False Belief</div>
      <button class="lock-btn" id="lock-belief" onclick="toggleLock('belief')">Lock</button>
    </div>
    <div class="card-body" id="belief-text"></div>
    <div class="card-note" id="belief-note"></div>
  </div>

  <div class="actions">
    <button class="btn" onclick="generateBoth()">Shuffle Both</button>
    <button class="btn primary" onclick="generate()">Generate New</button>
  </div>

</div>

<footer>
  <a href="/about.html" class="about-link">About Colin</a>
  <div class="social-links">
    <a href="https://www.instagram.com/literarycolin/" target="_blank" rel="noopener">Instagram</a>
    <a href="https://bsky.app/profile/colinjackofallbooks.bsky.social" target="_blank" rel="noopener">Bluesky</a>
    <a href="https://www.goodreads.com/user/show/21366299-colin-jack" target="_blank" rel="noopener">Goodreads</a>
    <a href="https://fable.co/fabler/literarycolin-410323518390?period_type=year" target="_blank" rel="noopener">Fable</a>
    <a href="https://app.thestorygraph.com/profile/literarycolin" target="_blank" rel="noopener">StoryGraph</a>
    <a href="https://pangobooks.com/bookstore/literarycolin" target="_blank" rel="noopener">PangoBooks</a>
  </div>
  <p class="copyright">&copy; 2026 Colin Merrill</p>
</footer>

<script>
const wounds = [
  {
    text: "A parent's love was conditional — given freely only when the child performed, achieved, or disappeared.",
    note: "The child learned that being seen was dangerous. Being truly known meant being judged."
  },
  {
    text: "They were the one who stayed calm in a crisis — praised for it, relied upon, never once asked how they were doing.",
    note: "Competence became a cage. Others' need for their steadiness consumed the space where their own needs might have lived."
  },
  {
    text: "They trusted someone completely, and that person used what they knew.",
    note: "Intimacy and exposure became the same thing. Vulnerability began to feel like handing someone a weapon."
  },
  {
    text: "They were failed publicly — humiliated in a moment when they most needed dignity.",
    note: "The memory didn't fade. It calcified into a rule: never be caught wanting something you might not get."
  },
  {
    text: "A sibling, friend, or rival was chosen over them — not once, but as a pattern.",
    note: "They learned to read every room for who the favorite was. They stopped trying to be it."
  },
  {
    text: "They witnessed something they couldn't stop and were never allowed to speak of it afterward.",
    note: "Silence became a form of complicity they've been paying for ever since."
  },
  {
    text: "They were given everything — comfort, opportunity, safety — and told they were lucky. They believed it, and it made them feel guilty for every want.",
    note: "The wound of ease itself. Desire without permission becomes shame."
  },
  {
    text: "They outgrew the place they came from, and the people they loved made them feel the distance as a betrayal.",
    note: "Ambition and belonging became mutually exclusive. They've been negotiating that loss ever since."
  },
  {
    text: "They failed at the one thing they built their identity around — and no one acknowledged how total the collapse was.",
    note: "They kept moving, kept performing competence. The grief went underground."
  },
  {
    text: "They were responsible for someone — a sibling, a parent, a friend — before they were old enough to be responsible for themselves.",
    note: "They learned to monitor others constantly and lost the habit of monitoring themselves."
  },
  {
    text: "They were loved intensely and then abandoned without explanation.",
    note: "Every close relationship since has carried the quiet question: when does this end, and why won't they tell me."
  },
  {
    text: "They told the truth once, at great cost, and it changed nothing.",
    note: "Honesty stopped feeling like virtue and started feeling like exposure with no return."
  },
  {
    text: "They were the peacekeeper in a volatile household — always smoothing, deflecting, absorbing.",
    note: "Conflict became existential. Other people's anger still feels like their fault to fix."
  },
  {
    text: "They were exceptional early — a prodigy, a golden child — and then became ordinary.",
    note: "Average began to feel like failure. They've been trying to recapture a self that may never have been real."
  },
  {
    text: "Someone they loved chose something else — work, an addiction, another person — over and over again.",
    note: "They learned not to ask for things directly. If you don't ask, you can't be chosen against."
  },
  {
    text: "They survived something others didn't, and no one talked about why.",
    note: "Survival accumulated interest. They've been trying to justify the cost ever since."
  },
  {
    text: "They were punished for a feeling — joy, anger, grief — until they stopped having it in front of others.",
    note: "The feeling didn't disappear. It just learned to hide, and now it comes out sideways."
  },
  {
    text: "Their competence was exploited by someone who should have protected them.",
    note: "Being useful became a threat. They learned to underperform, or to perform only where it couldn't be taken."
  },
  {
    text: "They were invisible in a family that rewarded loudness, or loud in one that rewarded silence.",
    note: "They are still calibrating. Still trying to find the register that finally makes someone turn and look."
  },
  {
    text: "A moment of moral failure — small, private, unwitnessed — that they've never been able to put down.",
    note: "Not guilt for what others saw. Guilt for what they know about themselves."
  }
];

const beliefs = [
  {
    text: "\"If I need something from someone, I will eventually be abandoned for it.\"",
    note: "They give generously and receive reluctantly. Need feels like a debt they'll be called on to repay."
  },
  {
    text: "\"The only safe way to be loved is to be useful.\"",
    note: "They don't know how to receive affection that isn't transactional. Unconditional love makes them nervous."
  },
  {
    text: "\"Showing weakness invites attack.\"",
    note: "They are hypervigilant in any hierarchy. They'd rather appear cold than appear breakable."
  },
  {
    text: "\"I have to earn the right to take up space.\"",
    note: "They apologize for existing. They make themselves smaller in rooms where no one asked them to."
  },
  {
    text: "\"Love always comes with a hidden cost I haven't found yet.\"",
    note: "They wait for the other shoe. They sometimes create the conflict just to stop waiting."
  },
  {
    text: "\"If people really knew me, they would leave.\"",
    note: "Intimacy is terrifying not because they distrust others, but because they distrust themselves."
  },
  {
    text: "\"Wanting things is the fastest way to lose them.\"",
    note: "They approach desire obliquely, if at all. Sometimes they don't let themselves want until it's too late."
  },
  {
    text: "\"The world is divided into people who are chosen and people who are not. I am not.\"",
    note: "They resist opportunities not out of laziness but out of preemptive self-protection."
  },
  {
    text: "\"If I stay in control, nothing bad can happen.\"",
    note: "They mistake the feeling of control for safety. They'll sacrifice connection to maintain it."
  },
  {
    text: "\"Other people's feelings are my responsibility.\"",
    note: "They can read a room from the doorway. They'll abandon their own needs to regulate someone else's mood."
  },
  {
    text: "\"Ambition is a form of betrayal.\"",
    note: "Every success carries guilt. They self-sabotage not from fear of failure but from loyalty to where they came from."
  },
  {
    text: "\"The truth doesn't change anything, so why pay the cost of saying it.\"",
    note: "They are not liars — they are exhausted by a world that didn't respond when they told the truth."
  },
  {
    text: "\"I am only as valuable as my last performance.\"",
    note: "Rest feels dangerous. Stillness feels like disappearing. They mistake activity for worth."
  },
  {
    text: "\"Conflict means someone is about to leave.\"",
    note: "They agree to things they don't agree with. They disappear before they can be disappeared."
  },
  {
    text: "\"I am different from everyone around me in a way that cannot be fixed.\"",
    note: "The loneliness is the price of being exceptional. They've made it a point of pride to need less."
  },
  {
    text: "\"If I ask for help, I am confirming that I am not enough.\"",
    note: "Competence is armor. Letting someone in means letting them see the gap between who they appear to be and who they are."
  },
  {
    text: "\"Being forgotten is safer than being remembered wrongly.\"",
    note: "They erase themselves before others can misread them. Invisibility feels like authorship."
  },
  {
    text: "\"Happiness is something that happens to other people and then gets taken away.\"",
    note: "They don't allow themselves to settle into good things. They're already grieving them on the way in."
  },
  {
    text: "\"If I stay small enough, nothing will be expected of me and I cannot disappoint anyone.\"",
    note: "They confuse potential with threat. Capability feels like an obligation they never signed up for."
  },
  {
    text: "\"I caused this. Whatever this is, I caused it.\"",
    note: "Blame is a form of control. If everything is their fault, at least the world is legible."
  }
];

let woundLocked = false;
let beliefLocked = false;
let currentWoundIdx = -1;
let currentBeliefIdx = -1;

function rand(arr, exclude) {
  let idx;
  do { idx = Math.floor(Math.random() * arr.length); } while (idx === exclude && arr.length > 1);
  return idx;
}

function toggleLock(type) {
  if (type === 'wound') {
    woundLocked = !woundLocked;
    const btn = document.getElementById('lock-wound');
    btn.textContent = woundLocked ? 'Locked' : 'Lock';
    btn.classList.toggle('locked', woundLocked);
  } else {
    beliefLocked = !beliefLocked;
    const btn = document.getElementById('lock-belief');
    btn.textContent = beliefLocked ? 'Locked' : 'Lock';
    btn.classList.toggle('locked', beliefLocked);
  }
}

function setCard(textId, noteId, data) {
  const textEl = document.getElementById(textId);
  const noteEl = document.getElementById(noteId);
  textEl.classList.add('fading');
  noteEl.classList.add('fading');
  setTimeout(() => {
    textEl.textContent = data.text;
    noteEl.textContent = data.note;
    textEl.classList.remove('fading');
    noteEl.classList.remove('fading');
  }, 180);
}

function generate() {
  if (!woundLocked) {
    const idx = rand(wounds, currentWoundIdx);
    currentWoundIdx = idx;
    setCard('wound-text', 'wound-note', wounds[idx]);
  }
  if (!beliefLocked) {
    const idx = rand(beliefs, currentBeliefIdx);
    currentBeliefIdx = idx;
    setCard('belief-text', 'belief-note', beliefs[idx]);
  }
}

function generateBoth() {
  woundLocked = false;
  beliefLocked = false;
  document.getElementById('lock-wound').textContent = 'Lock';
  document.getElementById('lock-wound').classList.remove('locked');
  document.getElementById('lock-belief').textContent = 'Lock';
  document.getElementById('lock-belief').classList.remove('locked');
  generate();
}

generate();
</script>
</body>
</html>
