<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fff;
    --accent: #8b3a1a;
    --faint: #d8d0bc;
    --gold: #b8922a;
    --muted: #6b5e4a;
    --card-bg: #faf8f4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  .tool-wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 24px 0;
  }

  .tool-header {
    text-align: center;
    margin-bottom: 52px;
  }

  .tool-header h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 2.2rem;
    font-weight: 300;
    letter-spacing: 0.06em;
  }

  .tool-header h1 em { font-style: italic; color: var(--accent); }

  .tool-header::after {
    content: '';
    display: block;
    width: 100px;
    height: 1px;
    background: var(--gold);
    margin: 14px auto 0;
  }

  .tool-header p {
    font-size: 0.88rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 14px;
  }

  /* CARDS */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--faint);
    padding: 20px 22px 18px;
    margin-bottom: 2px;
    transition: box-shadow 0.2s;
  }

  .card:hover { box-shadow: 0 2px 12px rgba(26,18,8,0.05); }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
  }

  .card-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 7px;
    padding-top: 1px;
  }

  .card-body {
    font-family: 'Crimson Pro', serif;
    font-size: 1.08rem;
    font-weight: 300;
    line-height: 1.65;
    color: var(--ink);
    min-height: 3.5rem;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .card-body.fading {
    opacity: 0;
    transform: translateY(4px);
  }

  .card-note {
    font-style: italic;
    font-size: 0.88rem;
    color: var(--muted);
    margin-top: 12px;
    line-height: 1.55;
    border-top: 1px solid var(--faint);
    padding-top: 12px;
    min-height: 2.5rem;
    transition: opacity 0.18s ease;
  }

  .card-note.fading { opacity: 0; }

  /* Contradiction line inside false belief card */
  .card-contradiction {
    font-style: italic;
    font-size: 0.88rem;
    color: var(--muted);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--faint);
    line-height: 1.55;
    transition: opacity 0.18s ease;
  }

  .card-contradiction.fading { opacity: 0; }

  .card-contradiction-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    display: block;
    margin-bottom: 4px;
  }

  /* LOCK BUTTON */
  .lock-btn {
    font-family: 'Crimson Pro', serif;
    font-size: 0.76rem;
    letter-spacing: 0.07em;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--faint);
    border-radius: 2px;
    padding: 3px 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .lock-btn:hover { border-color: var(--accent); color: var(--accent); }
  .lock-btn.locked { border-color: var(--accent); color: var(--accent); background: rgba(139,58,26,0.04); }

  /* CONNECTOR */
  .connector {
    display: flex;
    justify-content: center;
    height: 26px;
    font-size: 1.1rem;
    color: var(--gold);
    opacity: 0.45;
    align-items: center;
  }

  /* ACTIONS */
  .actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 40px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    letter-spacing: 0.1em;
    padding: 9px 26px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.18s;
    border-radius: 2px;
  }

  .btn:hover { background: var(--ink); color: #fff; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: #6d2c13; }
  .btn.copy { border-color: var(--faint); color: var(--muted); }
  .btn.copy:hover { border-color: var(--muted); background: transparent; color: var(--ink); }
  .btn.copy.copied { border-color: var(--gold); color: var(--gold); }
</style>

let locks = { wound: false, belief: false, fear: false, coping: false, truth: false };
let current = { wound: -1, belief: -1, fear: -1, coping: -1, truth: -1 };

function rand(arr, exclude) {
  let idx;
  do { idx = Math.floor(Math.random() * arr.length); } while (idx === exclude && arr.length > 1);
  return idx;
}

function toggleLock(type) {
  locks[type] = !locks[type];
  const btn = document.getElementById('lock-' + type);
  btn.textContent = locks[type] ? 'Locked' : 'Lock';
  btn.classList.toggle('locked', locks[type]);
}

function setCard(textId, noteId, data, contradictionId) {
  const textEl = document.getElementById(textId);
  const noteEl = document.getElementById(noteId);
  textEl.classList.add('fading');
  noteEl.classList.add('fading');

  if (contradictionId) {
    const cEl = document.getElementById(contradictionId);
    if (cEl) cEl.classList.add('fading');
  }

  setTimeout(() => {
    textEl.textContent = data.text;
    noteEl.textContent = data.note;
    textEl.classList.remove('fading');
    noteEl.classList.remove('fading');

    if (contradictionId && data.contradiction) {
      const cEl = document.getElementById(contradictionId);
      if (cEl) {
        cEl.textContent = data.contradiction;
        cEl.classList.remove('fading');
      }
    }
  }, 180);
}

function generate() {
  if (!locks.wound) {
    const idx = rand(wounds, current.wound);
    current.wound = idx;
    setCard('wound-text', 'wound-note', wounds[idx]);
  }
  if (!locks.belief) {
    const idx = rand(beliefs, current.belief);
    current.belief = idx;
    // Special handling for belief card which has contradiction
    const textEl = document.getElementById('belief-text');
    const noteEl = document.getElementById('belief-note');
    const contrEl = document.getElementById('contradiction-text');
    const contrCard = document.getElementById('belief-contradiction');
    textEl.classList.add('fading');
    noteEl.classList.add('fading');
    contrCard.classList.add('fading');
    setTimeout(() => {
      textEl.textContent = beliefs[idx].text;
      noteEl.textContent = beliefs[idx].note;
      contrEl.textContent = beliefs[idx].contradiction;
      textEl.classList.remove('fading');
      noteEl.classList.remove('fading');
      contrCard.classList.remove('fading');
    }, 180);
  }
  if (!locks.fear) {
    const idx = rand(fears, current.fear);
    current.fear = idx;
    setCard('fear-text', 'fear-note', fears[idx]);
  }
  if (!locks.coping) {
    const idx = rand(copingStrategies, current.coping);
    current.coping = idx;
    setCard('coping-text', 'coping-note', copingStrategies[idx]);
  }
  if (!locks.truth) {
    const idx = rand(truths, current.truth);
    current.truth = idx;
    setCard('truth-text', 'truth-note', truths[idx]);
  }
}

function copyProfile() {
  const w = wounds[current.wound];
  const b = beliefs[current.belief];
  const f = fears[current.fear];
  const c = copingStrategies[current.coping];
  const t = truths[current.truth];

  const profile = [
    'THE WOUND',
    w ? w.text : '',
    w ? w.note : '',
    '',
    'THE FALSE BELIEF',
    b ? b.text : '',
    b ? b.note : '',
    b && b.contradiction ? 'Hidden Contradiction: ' + b.contradiction : '',
    '',
    'THE FEAR',
    f ? f.text : '',
    f ? f.note : '',
    '',
    'THE COPING STRATEGY',
    c ? c.text : '',
    c ? c.note : '',
    '',
    'THE TRUTH THEY MUST LEARN',
    t ? t.text : '',
    t ? t.note : '',
  ].join('\n');

  navigator.clipboard.writeText(profile).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy Profile';
      btn.classList.remove('copied');
    }, 2000);
  });
}
